name: Extract V25 source into main

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/extract-v25-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract V25 source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="hanh-tinh-xanh-v25-online-realtime-vercel-firebase.zip"

          if [ ! -f "$ZIP" ]; then
            echo "Archive $ZIP does not exist; nothing to extract."
            exit 0
          fi

          TMP_DIR="$(mktemp -d)"
          unzip -q "$ZIP" -d "$TMP_DIR"

          # Copy the full V25 source tree to the repository root.
          rsync -a "$TMP_DIR"/ ./

          # Remove the old uploaded archive after source is extracted.
          rm -f "$ZIP"
          rm -rf "$TMP_DIR"

      - name: Commit extracted source to main
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi

          git commit -m "chore: extract V25 source into repository"
          git push origin HEAD:main
