<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07562f"><title>Đăng nhập — Hành Tinh Xanh</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:linear-gradient(130deg,#034c31,#176e4b);font-family:"UTM Avo",Arial,sans-serif;color:#131c25}
main{width:min(540px,100%);padding:32px;background:#fff;border-radius:24px;box-shadow:0 18px 60px #00362133}.brand{display:flex;gap:15px;align-items:center;margin-bottom:30px}.mark{width:65px;height:65px;border-radius:18px;background:#07562f;color:#fff;display:grid;place-items:center;font-size:22px;font-weight:700}.brand strong{display:block;font-size:21px}.brand small{display:block;margin-top:7px;color:#718094;font-size:13px}
h1{font-size:27px;margin:0 0 10px}p{font-size:14px;line-height:1.6;color:#718094}label{display:block;font-size:15px;margin:18px 0 7px}input{width:100%;padding:15px;border:1px solid #9eafc5;border-radius:12px;font:inherit;font-size:17px}input:focus{outline:3px solid #d8f0e1;border-color:#07562f}
button{margin-top:20px;width:100%;padding:16px;border:0;border-radius:13px;background:#07562f;color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer}button:disabled{opacity:.65;cursor:wait}
.msg{min-height:24px;font-size:13px;line-height:1.6;margin-top:16px;color:#b42c2c}.msg.ok{color:#17663d}.note{border-top:1px solid #e5e9ec;padding-top:18px;margin-top:18px;font-size:13px;line-height:1.65;color:#718094}
[hidden]{display:none!important}@media(max-width:480px){body{padding:14px}main{padding:25px 20px}.brand strong{font-size:18px}.brand small{font-size:11px}}
</style>
<script type="module" src="/login.js?v=31.3.0"></script>
</head>
<body>
<main>
<div class="brand"><div class="mark">HTX</div><div><strong>HÀNH TINH XANH</strong><small>Phần mềm Báo giá & Quản lý đơn in ấn</small></div></div>
<h1>Đăng nhập</h1>
<p>Đăng nhập bằng tài khoản nội bộ đã được Giám đốc tạo và phân quyền.</p>
<form id="loginForm">
<label for="loginUsername">Tên đăng nhập</label>
<input id="loginUsername" autocomplete="username" maxlength="64" required placeholder="Ví dụ: giamdoc">
<label for="loginPassword">Mật khẩu</label>
<input id="loginPassword" type="password" autocomplete="current-password" maxlength="128" required placeholder="Mật khẩu">
<button id="loginBtn" type="submit">ĐĂNG NHẬP</button>
</form>
<div class="msg" id="authMsg" role="alert" aria-live="polite"></div>
<div class="note">Chỉ tài khoản Giám đốc mới được tạo, khóa, xóa và phân quyền tài khoản nhân viên. Sau đăng nhập, trang mặc định là <b>Đơn sản xuất</b>.</div>
</main>
</body>
</html>
