name: Validate V28 UI and buttons

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check backend modules
        run: |
          node --check server.js
          node --check src/firebase-admin.js
          node --check src/auth.js
          node --check src/state-store.js
          node --check public/realtime.js
          node --check public/service-worker.js
      - name: Extract and check app inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          s=Path("public/app.html").read_text(encoding="utf-8")
          scripts=list(re.finditer(r"<script(?:\s[^>]*)?>",s))
          plain=[m for m in scripts if "src=" not in m.group(0) and "type=" not in m.group(0)]
          if not plain:
              raise SystemExit("Không tìm thấy inline script chính")
          m=plain[-1]
          end=s.find("</script>",m.end())
          Path("/tmp/app-inline.js").write_text(s[m.end():end],encoding="utf-8")
          PY
          node --check /tmp/app-inline.js
      - name: Audit button handlers and event targets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("public/app.html").read_text(encoding="utf-8")
          defs=set(re.findall(r"function\s+([A-Za-z_$][\w$]*)\s*\(",s))
          handlers=set()
          for code in re.findall(r'onclick="([^"]+)"',s):
              handlers.update(re.findall(r"\b([A-Za-z_$][\w$]*)\s*\(",code))
          handlers-={"if","for","while","confirm","alert"}
          missing=sorted(handlers-defs)
          if missing:
              raise SystemExit("Thiếu hàm onclick: "+", ".join(missing))
          ids=set(re.findall(r'\bid="([^"]+)"',s))
          event_ids=set(re.findall(r'\$\("([^"]+)"\)\.addEventListener\(',s))
          missing_ids=sorted(event_ids-ids)
          if missing_ids:
              raise SystemExit("Thiếu element cho addEventListener: "+", ".join(missing_ids))
          print(f"OK: {len(handlers)} onclick handlers, {len(event_ids)} event targets")
          PY
