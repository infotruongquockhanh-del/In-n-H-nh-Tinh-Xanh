name: Diagnose Firebase ea08e
on:
  push:
    branches: [diag/firebase-ea08e]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Firebase Authentication
        run: |
          code=$(curl -sS -o /tmp/auth.json -w "%{http_code}" "https://www.googleapis.com/identitytoolkit/v3/relyingparty/getProjectConfig?key=AIzaSyDG8zKczlv4CK4EjOHFpg5HlefO3B8YrmA")
          echo "AUTH_HTTP=$code"
          cat /tmp/auth.json
      - name: Probe Cloud Firestore
        run: |
          code=$(curl -sS -o /tmp/fs.json -w "%{http_code}" "https://firestore.googleapis.com/v1/projects/in-hanh-tinh-xanh-ea08e/databases/(default)/documents/config/bootstrap?key=AIzaSyDG8zKczlv4CK4EjOHFpg5HlefO3B8YrmA")
          echo "FIRESTORE_HTTP=$code"
          cat /tmp/fs.json
      - name: Probe Email Password provider
        run: |
          code=$(curl -sS -o /tmp/password.json -w "%{http_code}" -H "Content-Type: application/json" \
            -d '{"email":"probe-do-not-use@invalid.example","password":"Probe-Password-123!","returnSecureToken":true}' \
            "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=AIzaSyDG8zKczlv4CK4EjOHFpg5HlefO3B8YrmA")
          echo "PASSWORD_HTTP=$code"
          cat /tmp/password.json
      - name: Probe loginIndex bootstrap rule
        run: |
          code=$(curl -sS -o /tmp/loginindex.json -w "%{http_code}" "https://firestore.googleapis.com/v1/projects/in-hanh-tinh-xanh-ea08e/databases/(default)/documents/loginIndex/giamdoc?key=AIzaSyDG8zKczlv4CK4EjOHFpg5HlefO3B8YrmA")
          echo "LOGININDEX_HTTP=$code"
          cat /tmp/loginindex.json
      - name: Probe live website
        run: |
          code=$(curl -L -sS --max-time 20 -o /tmp/site.json -w "%{http_code}" "https://in-hanh-tinh-xanh.ai.studio/api/health")
          echo "SITE_HTTP=$code"
          cat /tmp/site.json
